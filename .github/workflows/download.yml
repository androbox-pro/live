name: TikTok HD Downloader (yt-dlp Best)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok ভিডিওর লিংক দিন'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg
        pip install --upgrade pip
        pip install --upgrade yt-dlp curl_cffi

    - name: Download TikTok Video (HD Priority)
      run: |
        mkdir -p downloads
        
        # সবচেয়ে ভালো মানের ফরম্যাট বেছে নেওয়া
        # res > height=1080 বা তার বেশি, bitrate অনুযায়ী সাজানো
        yt-dlp -f "bestvideo[height>=1080]+bestaudio/bestvideo[height>=720]+bestaudio/best" \
               --merge-output-format mp4 \
               --format-sort "res,bitrate" \
               --impersonate chrome \
               --extractor-args "tiktok:api_hostname=www.tiktok.com,app_info=auto" \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --no-check-certificate \
               --no-playlist \
               -o "downloads/%(title).40s_[%(id)s].%(ext)s" \
               "${{ inputs.video_url }}"

    - name: Upload HD Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-hd-video
        path: downloads/
