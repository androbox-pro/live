name: Download TikTok Without Watermark HD (1080p)

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create TikWM 1080p Ultra HD Specific Downloader
        run: |
          cat << 'EOF' > downloader.py
          import sys
          import re
          import requests
          import traceback

          raw_input = sys.argv[1] if len(sys.argv) > 1 else ""
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('Error: No valid URL found!')
              sys.exit(1)

          target_url = urls[0]
          print(f'Processing TikTok URL for 1080p HD: {target_url}')

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
          }

          api_url = 'https://www.tikwm.com/api/'
          payload = {
              'url': target_url,
              'hd': 1  # 1 forces 1920x1080 Ultra HD resolution stream
          }

          try:
              response = requests.post(api_url, data=payload, headers=headers, timeout=20)
              data = response.json()

              if data.get('code') != 0:
                  raise ValueError(f"API Error: {data.get('msg', 'Failed to parse video')}")

              video_data = data.get('data', {})
              
              # Priority 1: hdplay (1920x1080 Ultra HD Stream)
              # Priority 2: play (Standard Quality fallback if 1080p isn't uploaded)
              hd_video_url = video_data.get('hdplay')
              standard_video_url = video_data.get('play')

              if hd_video_url:
                  download_url = hd_video_url
                  print('SUCCESS: Isolated 1920x1080 Ultra HD (hdplay) stream!')
              elif standard_video_url:
                  download_url = standard_video_url
                  print('WARNING: 1080p HD stream not available for this video. Falling back to standard quality.')
              else:
                  raise ValueError('No valid download URL found in API response.')

              if not download_url.startswith('http'):
                  download_url = 'https://www.tikwm.com' + download_url

              print(f'Downloading stream from: {download_url}')
              video_res = requests.get(download_url, headers=headers, stream=True, timeout=30)
              video_res.raise_for_status()

              with open('video.mp4', 'wb') as f:
                  for chunk in video_res.iter_content(chunk_size=1024*1024):
                      if chunk:
                          f.write(chunk)

              print('Success: 1920x1080 Ultra HD Video downloaded successfully!')

          except Exception as e:
              print(f'Error occurred: {str(e)}')
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Run Script
        run: python downloader.py "${{ github.event.inputs.tiktok_url }}"

      - name: Upload 1080p Ultra HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-1080p-video
          path: video.mp4
          retention-days: 1
