name: Download TikTok Without Watermark HD (1080p)

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create Hybrid TikTok Downloader
        run: |
          cat << 'EOF' > downloader.py
          import sys
          import re
          import requests
          from bs4 import BeautifulSoup

          raw_input = sys.argv[1] if len(sys.argv) > 1 else ""
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('Error: No valid URL found!')
              sys.exit(1)

          input_url = urls[0]
          print(f'Input URL: {input_url}')

          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          # Resolve Shortened TikTok URL (vm.tiktok.com -> full URL)
          try:
              res_head = session.head(input_url, headers=headers, allow_redirects=True, timeout=10)
              target_url = res_head.url
              print(f'Resolved Full TikTok URL: {target_url}')
          except Exception:
              target_url = input_url

          hd_url = None

          # Engine 1: TikWM API
          print('Attempting Engine 1 (TikWM API)...')
          try:
              api_url = 'https://www.tikwm.com/api/'
              payload = {'url': target_url, 'hd': 1}
              tikwm_headers = headers.copy()
              tikwm_headers['Referer'] = 'https://www.tikwm.com/'
              
              resp = session.post(api_url, data=payload, headers=tikwm_headers, timeout=15)
              
              # Safely verify JSON before parsing
              if resp.status_code == 200 and resp.text.strip().startswith('{'):
                  data = resp.json()
                  if data.get('code') == 0:
                      v_data = data.get('data', {})
                      hd_url = v_data.get('hdplay') or v_data.get('play')
                      if hd_url:
                          print('Engine 1 SUCCESS: Stream isolated from TikWM!')
              else:
                  print(f'Engine 1 bypassed: Server returned non-JSON/Blocked response (Status {resp.status_code}).')
          except Exception as e:
              print(f'Engine 1 Warning: {str(e)}')

          # Engine 2: SSSTik HTMX Parsing (Fallback)
          if not hd_url:
              print('Attempting Engine 2 (SSSTik Parser Fallback)...')
              try:
                  ssstik_headers = headers.copy()
                  ssstik_headers['Referer'] = 'https://ssstik.io/en'
                  
                  res_page = session.get('https://ssstik.io/en', headers=ssstik_headers, timeout=10)
                  token_match = re.search(r's_tt\s*=\s*[\'"]([^\'"]+)[\'"]', res_page.text)
                  token = token_match.group(1) if token_match else ''

                  ssstik_api = 'https://ssstik.io/abc?url=dl'
                  ssstik_payload = {'id': target_url, 'locale': 'en', 'tt': token}
                  
                  ssstik_headers.update({
                      'hx-request': 'true',
                      'hx-target': 'target',
                      'hx-current-url': 'https://ssstik.io/en'
                  })

                  post_res = session.post(ssstik_api, data=ssstik_payload, headers=ssstik_headers, timeout=15)
                  soup = BeautifulSoup(post_res.text, 'html.parser')

                  for a in soup.find_all('a', href=True):
                      href = a.get('href', '')
                      text = a.get_text().strip().lower()
                      if href and ('without watermark' in text or 'hd' in text):
                          hd_url = href
                          print('Engine 2 SUCCESS: Stream isolated from SSSTik!')
                          break
                          
                  if not hd_url:
                      first_a = soup.find('a', href=True)
                      if first_a:
                          hd_url = first_a.get('href')
              except Exception as e:
                  print(f'Engine 2 Error: {str(e)}')

          if not hd_url:
              print('Error: Could not extract video stream from any engine.')
              sys.exit(1)

          if hd_url.startswith('/'):
              hd_url = 'https://ssstik.io' + hd_url

          print(f'Downloading 1080p Stream from: {hd_url}')
          download_res = session.get(hd_url, headers=headers, stream=True, timeout=30)
          download_res.raise_for_status()

          with open('video.mp4', 'wb') as f:
              for chunk in download_res.iter_content(chunk_size=1024*1024):
                  if chunk:
                      f.write(chunk)

          print('Success: Video saved as video.mp4')
          EOF

      - name: Run Script
        run: python downloader.py "${{ github.event.inputs.tiktok_url }}"

      - name: Upload 1080p Ultra HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-1080p-video
          path: video.mp4
          retention-days: 1
