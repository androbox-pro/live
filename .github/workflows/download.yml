name: TikTok HD Downloader (Exact File Size Match)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok ভিডিওর লিংক দিন'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg python3 python3-pip
        pip install --upgrade pip
        pip install yt-dlp curl_cffi

    - name: Get all formats with file sizes
      id: get_formats
      run: |
        yt-dlp --dump-json --impersonate chrome \
               --extractor-args "tiktok:api_hostname=www.tiktok.com,app_info=auto" \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               "${{ inputs.video_url }}" > video_info.json

    - name: Select the largest file format
      id: select_format
      run: |
        python3 << EOF
        import json
        import sys

        with open('video_info.json', 'r') as f:
            data = json.load(f)

        formats = data.get('formats', [])
        if not formats:
            print("❌ No formats found")
            sys.exit(1)

        # ফরম্যাটগুলো থেকে সাইজ বের করা (যেগুলো None নয়)
        valid_formats = []
        for fmt in formats:
            size = fmt.get('filesize') or fmt.get('filesize_approx')
            if size is not None:
                valid_formats.append((fmt, size))

        if valid_formats:
            # সবচেয়ে বড় সাইজের ফরম্যাট বেছে নেওয়া
            best_fmt, best_size = max(valid_formats, key=lambda x: x[1])
            format_id = best_fmt['format_id']
            resolution = f"{best_fmt.get('width', 'N/A')}x{best_fmt.get('height', 'N/A')}"
            print(f"✅ Best format: {format_id} (Size: {best_size} bytes, Resolution: {resolution})")
            with open('selected_format.txt', 'w') as out:
                out.write(format_id)
        else:
            # কোনো সাইজ পাওয়া যায়নি, তাহলে 'best' ব্যবহার করব
            print("⚠️ No format with size info found. Falling back to 'best'.")
            with open('selected_format.txt', 'w') as out:
                out.write('best')
        EOF

    - name: Download the selected format
      run: |
        FORMAT_ID=$(cat selected_format.txt)
        mkdir -p downloads
        
        yt-dlp -f "$FORMAT_ID" \
               --merge-output-format mp4 \
               --impersonate chrome \
               --extractor-args "tiktok:api_hostname=www.tiktok.com,app_info=auto" \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --no-check-certificate \
               --no-playlist \
               -o "downloads/%(title).40s_[%(id)s].%(ext)s" \
               "${{ inputs.video_url }}"

    - name: Upload HD Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-hd-video
        path: downloads/
