name: TikTok HD Downloader (Like ssstik.io)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok ভিডিওর লিংক দিন'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg
        pip install --upgrade pip
        pip install yt-dlp curl_cffi

    - name: Download TikTok Video (HD Priority)
      run: |
        mkdir -p downloads
        
        # --format-sort "bitrate,res" → মানে: সর্বোচ্চ বিটরেটকে প্রাধান্য দাও, তারপর রেজোলিউশন
        # -f "bestvideo+bestaudio/best" → ভিডিও+অডিও মার্জ করার চেষ্টা কর, না হলে শুধু best ফাইল নে
        yt-dlp -f "bestvideo+bestaudio/best" \
               --format-sort "bitrate,res" \
               --merge-output-format mp4 \
               --impersonate chrome \
               --extractor-args "tiktok:api_hostname=www.tiktok.com,app_info=auto" \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --no-check-certificate \
               --no-playlist \
               -o "downloads/%(title).40s_[%(id)s].%(ext)s" \
               "${{ inputs.video_url }}"

    - name: Upload HD Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-hd-video
        path: downloads/
