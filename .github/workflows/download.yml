name: Download TikTok 1080p Full HD

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create SSSTik 1080p Extractor Script
        run: |
          cat << 'EOF' > downloader.py
          import sys
          import re
          import requests
          from bs4 import BeautifulSoup

          raw_input = sys.argv[1]
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('Error: No valid URL found!')
              sys.exit(1)

          target_url = urls[0]
          print(f'Processing URL: {target_url}')

          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          try:
              # Get base page and s_tt token
              res = session.get('https://ssstik.io/en', headers=headers)
              token_match = re.search(r's_tt\s*=\s*[\'"]([^\'"]+)[\'"]', res.text)
              token = token_match.group(1) if token_match else ''

              api_url = 'https://ssstik.io/abc?url=dl'
              payload = {
                  'id': target_url,
                  'locale': 'en',
                  'tt': token
              }

              api_headers = headers.copy()
              api_headers['hx-request'] = 'true'
              api_headers['hx-target'] = 'target'
              api_headers['hx-current-url'] = 'https://ssstik.io/en'

              post_res = session.post(api_url, data=payload, headers=api_headers)
              soup = BeautifulSoup(post_res.text, 'html.parser')

              # SSSTik returns multiple download links. We filter specifically for the HD stream.
              hd_link = None
              all_links = soup.find_all('a', href=True)

              for a in all_links:
                  href = a['href']
                  text = a.get_text().lower()
                  # Check for HD explicitly or tikcdn / dl links
                  if 'hd' in text or 'without watermark hd' in text:
                      hd_link = href
                      break

              # Fallback to pure download link if HD text is inside class or separate button
              if not hd_link:
                  for a in all_links:
                      href = a['href']
                      if 'tikcdn' in href or 'ssstik' in href or 'snaptik' in href or '/dl' in href:
                          hd_link = href
                          break

              if not hd_link and all_links:
                  hd_link = all_links[0]['href']

              if not hd_link:
                  raise Exception('Could not extract 1080p HD link from SSSTik API.')

              print(f'Found 1080p HD Stream URL!')
              print(f'Downloading Full HD Video...')

              video_data = session.get(hd_link, headers=headers, stream=True)

              with open('video.mp4', 'wb') as f:
                  for chunk in video_data.iter_content(chunk_size=1024*1024):
                      if chunk:
                          f.write(chunk)

              print('Success: 1920x1080 Full HD Video downloaded successfully!')

          except Exception as e:
              print(f'Error occurred: {str(e)}')
              sys.exit(1)
          EOF

      - name: Run Downloader
        run: python downloader.py "${{ github.event.inputs.tiktok_url }}"

      - name: Upload 1080p HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-1080p-video
          path: video.mp4
          retention-days: 1
