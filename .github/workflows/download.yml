name: Download TikTok Video HD

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Download HD Video
        run: |
          # URL ছাড়া বাকি অতিরিক্ত টেক্সট বাদ দেওয়ার ফিল্টার
          CLEAN_URL=$(echo "${{ github.event.inputs.tiktok_url }}" | grep -o 'https://[^ ]*')
          yt-dlp -f "best" "$CLEAN_URL" -o "video.mp4"

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-hd-video
          path: video.mp4
          retention-days: 1
