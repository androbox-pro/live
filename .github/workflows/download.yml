name: Download TikTok HD Video Direct CDN

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Fetch and Download HD Video via TikWM CDN
        run: |
          python -c "
          import sys, re, requests

          raw_input = '''${{ github.event.inputs.tiktok_url }}'''
          # URL ফিল্টার
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('No valid URL found!')
              sys.exit(1)
          
          clean_url = urls[0]
          print(f'Fetching video for: {clean_url}')

          api_url = 'https://www.tikwm.com/api/'
          params = {'url': clean_url, 'hd': 1}
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }

          res = requests.get(api_url, params=params, headers=headers).json()
          
          if res.get('code') == 0:
              data = res.get('data', {})
              # HD লিংক থাকলে HD নেবে, না থাকলে নরমাল ওয়াটারমার্ক ছাড়া অরিজিনাল CDN লিংক নেবে
              video_url = data.get('hdplay') or data.get('play')
              
              print(f'Downloading directly from CDN stream...')
              video_bytes = requests.get(video_url, headers=headers).content
              
              with open('video.mp4', 'wb') as f:
                  f.write(video_bytes)
              print('Download completed successfully!')
          else:
              print(f'API Error: {res.get(\"msg\")}')
              sys.exit(1)
          "

      - name: Upload HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-hd-video
          path: video.mp4
          retention-days: 1
