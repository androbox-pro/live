name: Download TikTok Video Ultra HD

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp "curl_cffi"

      - name: Download Ultra HD Video
        run: |
          # URL ফিল্টার
          CLEAN_URL=$(echo "${{ github.event.inputs.tiktok_url }}" | grep -o 'https://[^ ]*' | head -n 1)
          
          # সর্বোচ্চ ফরম্যাট সিলেক্ট ও অরিজিনাল স্ট্রিম ডাউনলোড
          yt-dlp \
            --impersonate chrome \
            --extractor-args "tiktok:api_hostname=api22-normal-c-useast1a.tiktokv.com" \
            -f "bestvideo+bestaudio/best" \
            --format-sort "res,vcodec:h264,bbr,br" \
            --merge-output-format mp4 \
            -o "video.mp4" \
            "$CLEAN_URL"

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-hd-video
          path: video.mp4
          retention-days: 1
