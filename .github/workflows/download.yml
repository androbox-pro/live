name: Download TikTok HD Video Direct CDN

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create Python Extractor Script
        run: |
          cat << 'EOF' > downloader.py
          import sys
          import re
          import requests

          raw_input = sys.argv[1]
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('Error: No valid URL found!')
              sys.exit(1)

          target_url = urls[0]
          print(f'Processing URL: {target_url}')

          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          try:
              res = session.get('https://ssstik.io/en', headers=headers)
              token_match = re.search(r's_tt\s*=\s*[\'"]([^\'"]+)[\'"]', res.text)

              api_url = 'https://ssstik.io/abc?url=dl'
              payload = {
                  'id': target_url,
                  'locale': 'en',
                  'tt': token_match.group(1) if token_match else ''
              }

              api_headers = headers.copy()
              api_headers['hx-request'] = 'true'
              api_headers['hx-target'] = 'target'
              api_headers['hx-current-url'] = 'https://ssstik.io/en'

              post_res = session.post(api_url, data=payload, headers=api_headers)

              download_links = re.findall(r'href="([^"]+)"', post_res.text)
              direct_url = None

              for link in download_links:
                  if 'tikmate' in link or 'ssstik' in link or 'tikcdn' in link or 'dl' in link or 'snaptik' in link:
                      direct_url = link
                      break

              if not direct_url and download_links:
                  direct_url = download_links[0]

              if not direct_url:
                  raise Exception('Failed to extract direct CDN download link.')

              print('Direct Stream Found! Downloading Original Quality...')
              video_data = session.get(direct_url, headers=headers, stream=True)

              with open('video.mp4', 'wb') as f:
                  for chunk in video_data.iter_content(chunk_size=1024*1024):
                      if chunk:
                          f.write(chunk)

              print('Success: HD Video downloaded successfully!')

          except Exception as e:
              print(f'Error occurred: {str(e)}')
              sys.exit(1)
          EOF

      - name: Run Script and Download HD Video
        run: python downloader.py "${{ github.event.inputs.tiktok_url }}"

      - name: Upload HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-hd-video
          path: video.mp4
          retention-days: 1
