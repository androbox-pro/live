name: Download TikTok Original HD Video

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: 'Paste TikTok Video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Create Web-Page HTML Extractor Script
        run: |
          cat << 'EOF' > downloader.py
          import sys
          import re
          import json
          import requests
          from bs4 import BeautifulSoup

          raw_input = sys.argv[1]
          urls = re.findall(r'https?://[^\s]+', raw_input)
          if not urls:
              print('Error: No valid URL found!')
              sys.exit(1)

          input_url = urls[0]
          print(f'Original URL: {input_url}')

          session = requests.Session()
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Sec-Fetch-Mode': 'navigate',
          }

          # Resolve redirect link
          res = session.get(input_url, headers=headers, allow_redirects=True)
          final_url = res.url
          print(f'Expanded URL: {final_url}')

          soup = BeautifulSoup(res.text, 'html.parser')
          
          # Method 1: Extract JSON Data Embedded in Page
          script_tag = soup.find('script', id='__UNIVERSAL_DATA_FOR_REHYDRATION__') or soup.find('script', id='SIGI_STATE')
          
          download_url = None

          if script_tag and script_tag.string:
              try:
                  page_data = json.loads(script_tag.string)
                  default_scope = page_data.get('__DEFAULT_SCOPE__', {})
                  item_detail = default_scope.get('webapp.video-detail', {}).get('itemInfo', {}).get('itemStruct', {})
                  video_meta = item_detail.get('video', {})
                  
                  # Extract Bitrate Streams
                  bitrate_info = video_meta.get('bitrateInfo', [])
                  if bitrate_info:
                      # Sort by highest Bitrate / Resolution
                      sorted_bitrate = sorted(bitrate_info, key=lambda x: x.get('Bitrate', 0), reverse=True)
                      download_url = sorted_bitrate[0].get('PlayAddr', {}).get('UrlList', [None])[0]
                  
                  if not download_url:
                      download_url = video_meta.get('playAddr', '')
              except Exception as e:
                  print(f'JSON parsing error: {e}')

          # Method 2: Fallback to Meta Tag Direct Video Url
          if not download_url:
              meta_video = soup.find('meta', property='og:video') or soup.find('meta', property='og:video:secure_url')
              if meta_video and meta_video.get('content'):
                  download_url = meta_video['content']

          if not download_url:
              print('Error: Could not extract original stream URL from page metadata.')
              sys.exit(1)

          print(f'Stream Found! Downloading Original High-Bitrate Video...')
          
          # Headers with Referer required for TikTok CDN
          stream_headers = headers.copy()
          stream_headers['Referer'] = 'https://www.tiktok.com/'

          video_file = session.get(download_url, headers=stream_headers, stream=True)

          with open('video.mp4', 'wb') as f:
              for chunk in video_file.iter_content(chunk_size=1024*1024):
                  if chunk:
                      f.write(chunk)

          print('Success: Original HD Video downloaded successfully!')
          EOF

      - name: Run Script
        run: python downloader.py "${{ github.event.inputs.tiktok_url }}"

      - name: Upload HD Video
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-hd-video
          path: video.mp4
          retention-days: 1
