name: TikTok Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'TikTok ভিডিওর লিংক দিন (www.tiktok.com/... অথবা vm.tiktok.com/...)'
        required: true
        type: string
      quality:
        description: 'কোয়ালিটি (best / 1080 / 720)'
        default: 'best'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg

    - name: Install yt-dlp with impersonation support
      run: |
        pip install --upgrade pip
        pip install yt-dlp curl_cffi

    - name: Download TikTok Video
      run: |
        mkdir -p downloads
        yt-dlp -f "bestvideo[height<=${{ inputs.quality == 'best' && '9999' || inputs.quality }}]+bestaudio/best" \
               --merge-output-format mp4 \
               --impersonate chrome \
               --extractor-args "tiktok:api_hostname=www.tiktok.com,app_info=auto" \
               --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --no-check-certificate \
               -o "downloads/%(title).40s_[%(id)s].%(ext)s" \
               "${{ inputs.video_url }}"

    - name: Upload Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-video
        path: downloads/
