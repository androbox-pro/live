name: Live Stream Video to Facebook

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Stream to Facebook Live
      env:
        FB_STREAM_KEY: ${{ secrets.FB_STREAM_KEY }}
      run: |
        ffmpeg -re -i video.mp4 \
          -c:v libx264 -preset veryfast -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ac 2 -ar 44100 \
          -f flv \
          -rtmp_buffer 1000 -rtmp_live live \
          "rtmps://live-api-s.facebook.com:443/rtmp/$FB_STREAM_KEY"